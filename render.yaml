services:
  - type: worker
    name: telegram-auto-filter
    runtime: python
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python bot.py
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELETHON_SESSION_PATH
        sync: false
