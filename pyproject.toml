[project]
name = "telegram-auto-filter"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["bot.py", "gen_session.py", "autofilter/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC"]
